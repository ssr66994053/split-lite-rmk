# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "RMK Split_Lite_Mod"
product_name = "RMK Split42_Lite"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "esp32c3"
usb_enable = false

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_13", "PIN_19", "PIN_18", "PIN_12"]
col_pins = ["PIN_9", "PIN_8", "PIN_4", "PIN_5", "PIN_11", "PIN_7", "PIN_6", "PIN_10", "PIN_3", "PIN_2", "PIN_1", "PIN_0"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 4
cols = 3
map = """
(0,0)  (0,1)  (0,2)
(1,0)  (1,1)  (1,2)
(2,0)  (2,1)  (2,2)
(3,0)  (3,1)  (3,2)
"""

[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
_  TT(1)  TG(2)
_  _      _
_  _      _
_  _      _
"""
